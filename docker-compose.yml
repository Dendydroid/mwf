services:

  # ── Database ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:${DB_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── vLLM (OpenAI-compatible inference server) ─────────────────────────────
  vllm:
    build:
      context: ./docker/vllm
      dockerfile: Dockerfile
      args:
        VLLM_IMAGE: ${LLM_IMAGE:-vllm/vllm-openai:latest}
    image: ai-assistant-vllm:latest
    restart: unless-stopped
    # vLLM needs a large shared-memory segment for its worker processes
    ipc: host
    environment:
      LLM_MODEL: ${LLM_MODEL}
      LLM_HOST: 0.0.0.0
      LLM_PORT: ${LLM_PORT}
      LLM_MAX_MODEL_LEN: ${LLM_MAX_MODEL_LEN}
      LLM_GPU_MEMORY_UTILIZATION: ${LLM_GPU_MEMORY_UTILIZATION}
      LLM_ENABLE_PREFIX_CACHING: ${LLM_ENABLE_PREFIX_CACHING}
      LLM_SERVED_MODEL_NAME: ${LLM_SERVED_MODEL_NAME:-}
      LLM_TENSOR_PARALLEL_SIZE: ${LLM_TENSOR_PARALLEL_SIZE:-}
      LLM_DTYPE: ${LLM_DTYPE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EXTRA_ARGS: ${LLM_EXTRA_ARGS:-}
      # Real vLLM setting: WSL2 keeps pinned memory off by default, but the
      # v2 GPU model runner needs UVA, which needs pinned memory.
      VLLM_WSL2_ENABLE_PIN_MEMORY: ${LLM_WSL2_PIN_MEMORY:-1}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "${LLM_PORT}:${LLM_PORT}"
    volumes:
      # Model weights cache — keeps downloads across container rebuilds
      - ${LLM_CACHE_DIR:-./models}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${LLM_GPU_COUNT:-all}
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:${LLM_PORT}/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      # First boot downloads and loads the weights, which can take a while
      start_period: 600s

  # ── Classifier (machine #1 without an LLM, on the CPU) ─────────────────────
  # Always started; the app uses it only with INTENT_MATCHER=classifier.
  classifier:
    build:
      context: ./docker/classifier
      dockerfile: Dockerfile
    image: ai-assistant-classifier:latest
    restart: unless-stopped
    environment:
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CLASSIFIER_LANGUAGES: ${CLASSIFIER_LANGUAGES:-}
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "${CLASSIFIER_PORT:-8090}:8090"
    volumes:
      # The same weights cache as vLLM's
      - ${LLM_CACHE_DIR:-./models}:/root/.cache/huggingface
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')" ]
      interval: 15s
      timeout: 5s
      retries: 5
      # First boot downloads the model
      start_period: 300s

  # ── Application ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
      classifier:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: ${APP_PORT}
      # The container's clock, which gives the assistant its `current_time`.
      TZ: ${APP_TIMEZONE:-UTC}
      FORM_SUBMIT_URL: ${FORM_SUBMIT_URL:-}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      LLM_URL: http://vllm:${LLM_PORT}/v1
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      INTENT_MATCHER: ${INTENT_MATCHER:-llm}
      CLASSIFIER_URL: http://classifier:8090
      # Where the app writes its rolling log files *inside* the container. The
      # volume below maps that to ./logs on the host, so the logs survive the
      # container being rebuilt or removed - which `docker logs` alone does not.
      LOG_DIR: ${LOG_DIR:-/var/log/app}
      LLM_SYSTEM_PROMPT_FILE: ${LLM_SYSTEM_PROMPT_FILE:-prompts/system_prompt.txt}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      # A bind mount rather than a named volume: the point is being able to open
      # the files from the project folder without going through Docker.
      - ${LOG_HOST_DIR:-./logs}:/var/log/app
      # The prompts, mounted read-only over the copies baked into the image.
      # This is what makes trying a different prompt an edit and a saved file
      # instead of a four-minute rebuild: the app re-reads the file every turn.
      - ./app/prompts:/app/prompts:ro

volumes:
  db_data:
  redis_data:
