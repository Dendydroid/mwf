[workspace]
members = [
    "app",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
time = { version = "0.3", features = ["serde-human-readable"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "macros"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.2.2"
# preserve_order: a decision's keys keep the order the model emitted them, which
# is the order the system prompt lists them in. Without it serde_json sorts them
# alphabetically and the client's badges come out in an order nobody chose.
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
config = { version = "0.14", features = ["toml"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
rmp-serde = "1.3.1"
rand = "0.8"
hex = "0.4"
reqwest = { version = "0.13.5", features = ["json"] }
quick-xml = { version = "0.42", features = ["serialize"] }
lingua = { version = "1.8", default-features = false, features = ["english", "german", "russian", "ukrainian"] }

# Dev dependencies
tokio-test = { version = "1", package = "tokio", features = ["test-util"] }

[workspace.lints.clippy]
all = "allow"
pedantic = "warn"

# Allow
