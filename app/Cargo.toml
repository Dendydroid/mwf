[package]
name = "app"
version = "0.1.0"
edition = "2021"

[features]
# `--local-stt-mode`: the microphone, the loudspeaker, the speech models and the
# window. Off by default, because the container has no sound card and no screen.
local-stt = ["dep:sherpa-onnx", "dep:rodio", "dep:eframe"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tower-http = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
dotenvy = { workspace = true }
config = { workspace = true }
rmp-serde = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true }
quick-xml = { workspace = true }
uuid = { workspace = true }
lingua = { workspace = true }
sherpa-onnx = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
