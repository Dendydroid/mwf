# Every text the assistant says to a caller or shows a machine. The code has no text of its own: it
# finds one here by its key, which is the name of an enum's variant or of a form's field.
#
#   - A text with de / en / ru / uk under it is said to the caller as it is, in the caller's language.
#     Every such text needs all four.
#   - Every other text is English and goes into a machine's prompt.
#   - {name} inside a text is filled in by the code.
#
# The file is read once when the app starts, and the app does not start when a text it can ask for is
# missing. A change needs a restart (in Docker: ./update-app.sh).


# ══════════════════════════════════════════════════════════════════════════════════════════════════
#  Said by code in any form: `Phrase` in app/src/vocabulary.rs
# ══════════════════════════════════════════════════════════════════════════════════════════════════

# The caller said yes to a value that was read back
[phrases.thanks]
de = "Danke."
en = "Thank you."
ru = "Спасибо."
uk = "Дякую."

# The caller said no to it
[phrases.sorry]
de = "Entschuldigung."
en = "Sorry about that."
ru = "Прошу прощения."
uk = "Перепрошую."

# The third no to the value of one field
[phrases.offer_human]
de = "Entschuldigung, das war wieder falsch. Wenn Sie möchten, verbinde ich Sie mit einer Kollegin oder einem Kollegen."
en = "I'm sorry, I got that wrong again. If you prefer, just ask me for a human colleague."
ru = "Прошу прощения, снова неверно. Если хотите, я соединю вас с сотрудником."
uk = "Перепрошую, знову неправильно. Якщо бажаєте, я з'єднаю вас зі співробітником."

# A value that could not be read, or an answer that gave none
[phrases.not_understood]
de = "Das habe ich leider nicht verstanden."
en = "Sorry, I didn't catch that."
ru = "К сожалению, не удалось разобрать ответ."
uk = "На жаль, не вдалося розібрати відповідь."

# A request the form cannot take, such as the weather
[phrases.cannot_help_in_form]
de = "Dabei kann ich im Moment leider nicht helfen."
en = "Sorry, I can't help with that right now."
ru = "К сожалению, сейчас я не могу с этим помочь."
uk = "На жаль, зараз я не можу з цим допомогти."

# A caller who only says hello in the main menu. What is offered is said after it
[phrases.hello]
de = "Guten Tag."
en = "Hello."
ru = "Здравствуйте."
uk = "Вітаю."

# A request the main menu cannot take, such as the weather of another city. What is offered is said
# after it
[phrases.cannot_help_in_main_menu]
de = "Dabei kann ich Ihnen leider nicht helfen."
en = "Sorry, I can't help with that."
ru = "К сожалению, с этим я помочь не могу."
uk = "На жаль, з цим я допомогти не можу."

# What the assistant can help with. {offers} are the `offer` texts of the main menu's intents, one
# after the other with a comma between them
[phrases.offers]
de = "Ich kann Ihnen Folgendes anbieten: {offers}."
en = "I can help you with the following: {offers}."
ru = "Я могу помочь со следующим: {offers}."
uk = "Я можу допомогти з таким: {offers}."

# The caller ends the call while a form is open
[phrases.goodbye]
de = "Vielen Dank für Ihren Anruf. Auf Wiederhören."
en = "Thank you for calling. Goodbye."
ru = "Спасибо за звонок. До свидания."
uk = "Дякую за дзвінок. До побачення."

# The caller asks for a human while a form is open
[phrases.transfer]
de = "Ich verbinde Sie jetzt mit einer Kollegin oder einem Kollegen."
en = "I am transferring you to a human colleague now."
ru = "Сейчас я соединю вас с сотрудником."
uk = "Зараз я з'єднаю вас зі співробітником."

# A machine failed, so the turn was taken back: in the main menu, and inside a form
[phrases.turn_failed_in_main_menu]
de = "Entschuldigung, bei uns ist ein Fehler aufgetreten, bitte versuchen Sie es noch einmal. Ich kann Ihnen das aktuelle Wetter in Berlin oder den Wechselkurs von Hrywnja zu Euro nennen oder einen Arzttermin für Sie buchen."
en = "Sorry, an error happened on our side, please try again. I can tell you the current weather in Berlin, the hryvnia to euro exchange rate, or book a doctor's appointment."
ru = "Извините, на нашей стороне произошла ошибка, пожалуйста, попробуйте ещё раз. Я могу подсказать текущую погоду в Берлине, курс гривны к евро или записать вас на приём к врачу."
uk = "Вибачте, на нашому боці сталася помилка, будь ласка, спробуйте ще раз. Я можу підказати поточну погоду в Берліні, курс гривні до євро або записати вас на прийом до лікаря."

[phrases.turn_failed_in_form]
de = "Entschuldigung, bei uns ist ein Fehler aufgetreten, bitte wiederholen Sie das noch einmal."
en = "Sorry, an error happened on our side, please say that again."
ru = "Извините, на нашей стороне произошла ошибка, пожалуйста, повторите ещё раз."
uk = "Вибачте, на нашому боці сталася помилка, будь ласка, повторіть ще раз."


