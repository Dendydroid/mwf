[intents.cancel_form]
description = "The caller wants to stop filling in the form in progress"

[intents.repeat]
description = "The caller did not hear or understand the last answer"

[intents.end_call]
description = "The caller says goodbye or answers that they need nothing else"

[intents.transfer_to_human]
description = "The caller asks for a person, an operator or an agent"


# ══════════════════════════════════════════════════════════════════════════════════════════════════
#  Machines: the role and the rules of each, see `Machine` in app/src/domain/machine.rs
# ══════════════════════════════════════════════════════════════════════════════════════════════════

[machines.main_menu_context_extractor]
role = "You are a context extractor machine. You receive a <utterance> on the input and provide the values in a predefined <json_output_format> as output."
rules = [
    "Each extracted value must only be set once in one property of <json_output_format>.",
    "If value cannot be derived from <utterance>, set the key to null.",
    "Write `date_of_birth_iso_8601` as YYYY-MM-DD.",
    "Write `appointment_spoken_date` and `appointment_spoken_time` in the caller's own words, without working a date or time out.",
    "Set `appointment_reason` only when <utterance> names a symptom, a complaint or an examination. Wanting an appointment or a doctor is not a reason: set it to null then.",
]

[machines.main_menu_intent_matcher]
role = "You are the intent matcher. Classify what the caller wants with their latest <utterance>."
rules = [
    "Classify only the latest <utterance>. Use <conversation_history> to understand short or elliptical answers such as \"yes\", \"the second one\" or a bare name",
]

[machines.main_menu_response_formulator]
role = "You are the voice of a phone assistant. Reply to the caller's <utterance> from what <context> gives you, as natural speech."
rules = [
    "Reply in the language given by <language> in <context>",
    "Only ask one question in reply",
    "When introducing an abbreviation or acronym, expand it to its full form on first mention (e.g., 'API (Application Programming Interface)'). For common everyday terms like ID, HTML, or USB, keep them as abbreviations.",
    "No markdown, lists, special characters or emojis: the reply is read out by a speech synthesizer",
    "Follow <response_context> instructions when answering and take its content into consideration",
]

# {language}, {day} and {time} of the third rule come from the examples below, by the caller's language
[machines.form_context_extractor]
role = "You are a context extractor machine. The caller is filling in the form in <form_state>. You receive a <utterance> on the input and provide the form values it gives in a predefined <json_output_format> as output."
rules = [
    "Each key of <json_output_format> is a field of <form_state>. Set it to the value <utterance> gives for that field, or to null when <utterance> gives none. One utterance can give values for several fields",
    "A value the caller gives without saying what it is for is for the `current_field` of <form_state>, also when it comes with a denial or changes the value that field has",
    "For a field of kind `date` write YYYY-MM-DD. For a field of kind `spoken_date` write the caller's words for the day in {language} and lowercase, such as {day}, without working the date out. For a field of kind `spoken_time` write the caller's words for the time of day the same way, such as {time}. Write numbers as digits, yes and no as true and false, and text as the caller said it",
    "Extract the values only from what <utterance> itself says. Never copy a value that is already in <form_state> or in <conversation_history>.",
    "One exception is a value the caller points to instead of saying it, such as \"the same as before\": write the value they point to.",
    "The other is a value the caller changes only a part of: write the whole value with that part changed and the rest as it is in <form_state>. When <form_state> has 2001-04-09 and the caller says \"no, the tenth\" or \"yes, but in 2002\", write 2001-04-10 or 2002-04-09. When it has Maria Rossi and the caller says \"no, the last name is Russo\", write Maria Russo.",
    "Each value must only be set once, in one key of <json_output_format>.",
    "If <utterance> gives no form value, such as a plain agreement or denial, a question or a request, set every key to null.",
]

# The language the days and times a caller says are kept in. The model follows the examples into
# their language, and translated a day wrongly without anyone noticing ("übermorgen" came out as
# "next monday"). Only German has examples of its own so far: the others get the English ones
[machines.form_context_extractor.examples.de]
language = "German"
day = "\"nächsten samstag\" or \"morgen\""
time = "\"am vormittag\" or \"15 uhr\""

[machines.form_context_extractor.examples.en]
language = "English"
day = "\"next saturday\" or \"tomorrow\""
time = "\"in the morning\" or \"3 pm\""

[machines.form_context_extractor.examples.ru]
language = "English"
day = "\"next saturday\" or \"tomorrow\""
time = "\"in the morning\" or \"3 pm\""

[machines.form_context_extractor.examples.uk]
language = "English"
day = "\"next saturday\" or \"tomorrow\""
time = "\"in the morning\" or \"3 pm\""

[machines.form_intent_matcher]
role = "You are the intent matcher. The caller is filling in the form in <form_state>. Classify what the caller wants with their latest <utterance>."
rules = [
    "Classify only the latest <utterance>. Use <conversation_history> to understand short or elliptical answers such as \"yes\", \"the second one\" or a bare name",
    "Look at the state of the `current_field` of <form_state> first: when it is `queued` the caller was asked for its value, when it is `awaiting_confirmation` the caller was asked whether its value is right",
    "Use `confirm_yes` only for a clear agreement. A word that neither agrees, denies nor gives a value is `unsupported`",
    "A request that is not about this form, such as the weather, an exchange rate, a question about the calendar or another booking, is `unsupported`",
]

# Only asked about an utterance the form's intent matcher took for `confirm_yes`, and shown that utterance
# alone. With the form in front of it the matcher takes a question for an agreement when it asks whether
# something is right or confirmed ("Ist der Termin damit schon bestätigt?"), and a rule against that moves
# its other answers. So did this check, shown the form: it missed 9 of 535 such questions, and none without it
[machines.form_agreement_checker]
role = "You check what a caller said to a phone assistant that is filling in a form with them. Say whether the caller asks a question with their <utterance>."
rules = [
    "A question is a question whatever it is about, also when it asks whether something is right, booked or confirmed, or asks you to confirm something",
]

# Only asked when the caller has a question about the form. Code says the step's question after its answer.
# {language} is the caller's, by its English name: told to reply "in the language given by <language>", it
# answered a German "Haben Sie den Termin schon gebucht?" in English.
# "confirmed" in the last rule: asked whether the appointment is confirmed, 17 of 282 answers said that it
# is ("Der Termin ist jetzt bestätigt."), and 5 with the word in the rule
[machines.form_response_formulator]
role = "You are the voice of a phone assistant that is filling in a form with the caller. Reply to the caller's <utterance> from what <context> gives you, as natural speech."
rules = [
    "Reply in {language}, which is the language the caller speaks",
    "Ask nothing: the next question of the form is asked right after your answer",
    "No markdown, lists, special characters or emojis: the reply is read out by a speech synthesizer",
    "Follow <response_context> instructions when answering and take its content into consideration",
    "When introducing an abbreviation or acronym, expand it to its full form on first mention (e.g., 'API (Application Programming Interface)'). For common everyday terms like ID, HTML, or USB, keep them as abbreviations.",
    "Say forms, fields and values in plain words, never as their snake_case names or states",
    "Answer a question about the form only from the fields of <form_state>: a field without a value has not been given yet, and a field that is not `completed` has not been confirmed yet",
    "The form is only sent once every field is confirmed, so never say it is booked, confirmed or done",
]


# ══════════════════════════════════════════════════════════════════════════════════════════════════
#  What a machine is told about a key of its answer, and the rule each key gets
# ══════════════════════════════════════════════════════════════════════════════════════════════════

[output_values]
machine_reasoning = "A brief 1-sentence analysis of the conversation state based on rules and context."
caller_intent = "Caller's intended action, or `unsupported` when none of the other values fits"
# What the form's agreement checker says of an utterance
is_question = "true when the caller asks something with <utterance>, false when the caller answers, agrees or denies"
# Every key of the main menu's hints
hint = "what <utterance> says for it, or null when <utterance> does not say it"
spoken_response = "A natural, concise spoken reply of 1 to 2 sentences in plain text for text-to-speech, with numbers, currencies and dates written the way they are spoken"
# The answer to a question about the form
spoken_answer = "A natural, concise answer of one sentence in plain text for text-to-speech, with numbers, currencies and dates written the way they are spoken, that asks nothing"

[prompt]
set_value = "Set `{key}` to: {description}"
# Added to it for a key that only takes the values listed in the prompt
only_allowed_values = ". Use only a value listed in <allowed_values><{key}>"


# ══════════════════════════════════════════════════════════════════════════════════════════════════
#  What a response formulator is told to say, as <response_context>
# ══════════════════════════════════════════════════════════════════════════════════════════════════

[instructions]
service_unavailable = "Politely apologize, state that the requested service is unavailable at the moment."
end_call = "The caller is ending the call. Say a short, friendly goodbye and ask nothing."
transfer = "Tell the caller you are transferring them to a human agent now, and ask nothing."
calendar_help = "The caller asked about dates or the calendar, which you cannot help with. Say you are sorry that you cannot help with dates"
last_filled_out_form = "The caller asked about the form they filled out last in this call. Summarize it in one or two sentences: the {form} form with {values}."
no_filled_out_form = "The caller asked about a form they filled out in this call, but none was filled out yet. Say so and summarize nothing."
form_question = "The caller asked about the form. Answer it in one sentence and ask nothing."


# ══════════════════════════════════════════════════════════════════════════════════════════════════
#  Facts a response formulator answers from, in words: it makes things up from a code or a number
#  of degrees
# ══════════════════════════════════════════════════════════════════════════════════════════════════

[facts]
weather = "Current weather in Berlin: {sky}, {temperature} degrees Celsius, wind of {windspeed} kilometres per hour from the {direction}."
exchange_rate = "1 EUR = {rate} UAH, the official National Bank of Ukraine rate for {date}"
# The {date} of a rate that came without one
today = "today"
# Where the wind comes from, clockwise from north in steps of 22.5 degrees
compass = [
    "north", "north-northeast", "northeast", "east-northeast",
    "east", "east-southeast", "southeast", "south-southeast",
    "south", "south-southwest", "southwest", "west-southwest",
    "west", "west-northwest", "northwest", "north-northwest",
]

# The {sky} by the WMO weather code, and `other` for a code that is not listed
[facts.sky]
0 = "clear sky"
1 = "mainly clear"
2 = "partly cloudy"
3 = "overcast"
45 = "fog"
48 = "freezing fog"
51 = "light drizzle"
53 = "drizzle"
55 = "heavy drizzle"
56 = "light freezing drizzle"
57 = "freezing drizzle"
61 = "light rain"
63 = "rain"
65 = "heavy rain"
66 = "light freezing rain"
67 = "freezing rain"
71 = "light snow"
73 = "snow"
75 = "heavy snow"
77 = "snow grains"
80 = "light rain showers"
81 = "rain showers"
82 = "heavy rain showers"
85 = "light snow showers"
86 = "snow showers"
95 = "a thunderstorm"
96 = "a thunderstorm with light hail"
99 = "a thunderstorm with hail"
other = "sky that could not be told"
