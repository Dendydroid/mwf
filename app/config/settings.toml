# Defaults for values that the environment may override (config::Environment is
# layered on top of this file, so LLM_URL/LLM_MODEL win when they are exported).
# They live here as well so `cargo test` and a bare `cargo run` have something
# sane to point at instead of panicking on a missing variable.
llm_url = "http://localhost:8000/v1"
llm_model = "Qwen/Qwen2.5-7B-Instruct-AWQ"
# Relative to the working directory, like this file itself: app/ when run with
# cargo, /app/ in the container. The file is re-read every turn, so editing the
# prompt needs no restart - see app/prompts/README.md.
llm_system_prompt_file = "prompts/system_prompt.txt"

[call_settings]
default_language = "de"

[database_settings]
max_connections = 20
timeout_seconds = 3

[cache_settings]
session_ttl_days = 1
call_session_ttl_seconds = 3600

[llm_settings]
# A turn normally takes 1-3s against a warm vLLM. This is not sized for that, it
# is sized for the bad day: a cold or contended GPU has been measured taking
# 30s+ for a single turn, and 30 here turned that into a 502 for the caller.
timeout_seconds = 120
# Deterministic routing - see LlmSettings::temperature.
temperature = 0.0
# A well-formed answer for this schema is around 50 tokens. This leaves room for
# a long sentence while stopping a repetition loop from generating to the end of
# the 4096-token context window, which is the way a single turn ends up holding
# the GPU for minutes.
max_tokens = 256

# Only --local-stt-mode reads the two sections below. Their paths are relative to
# the project root, where that mode is run from. ./run-local-stt.sh downloads
# what they name under models/speech from the sherpa-onnx releases, so another
# model of the same kind is a changed name here.
[stt_settings]
vad_model = "models/speech/silero_vad.onnx"
model_dir = "models/speech/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"
# 4 for both models: 8 was slower on the 8 cores of an i7-9700K.
num_threads = 4
# The caller is done after this much silence. Shorter answers sooner and cuts
# in on a caller who stops to think.
end_of_utterance_silence_seconds = 0.6

[tts_settings]
num_threads = 4

# One Piper voice per language the assistant answers in. An answer in a language
# without one (ru, uk) is not spoken. Both are "medium" and CC0. A "high" voice
# takes four times as long: thorsten-high needed 0.6-0.8 s to the first sound
# of a three-second sentence on an i7-9700K, thorsten-medium 0.15 s.
[tts_settings.voices]
de = "models/speech/vits-piper-de_DE-thorsten-medium"
en = "models/speech/vits-piper-en_US-joe-medium"
